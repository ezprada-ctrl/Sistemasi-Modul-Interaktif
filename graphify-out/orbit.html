<meta charset="utf-8">
<title>Orbit Kode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500&display=swap">
<style>
  :root{
    --void:#03060a;
    --glow:#5be8d4;
    --glow-dim:#27514c;
    --signal:#ffb454;
    --ink:#cfe9e6;
    --faint:#54706f;
    --danger:#ff7a6b;
    --mono:'IBM Plex Mono', ui-monospace, Consolas, monospace;
    --sans:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--void);}
  body{font-family:var(--sans);color:var(--ink);cursor:default;}
  body.sembunyi{cursor:none;}
  canvas{display:block;position:absolute;inset:0;width:100%;height:100%;}

  .lapis{position:absolute;inset:0;pointer-events:none;z-index:3;}
  .vignette{background:radial-gradient(ellipse at center, transparent 42%, rgba(1,3,6,.72) 100%);}

  /* ---------- chrome HUD, meredup sendiri saat ditinggal ---------- */
  .hud{position:absolute;inset:0;z-index:5;pointer-events:none;
       transition:opacity 1.2s ease;}
  .hud.redup{opacity:0;}
  .hud > *{pointer-events:auto;}

  .atas{position:absolute;top:0;left:0;right:0;padding:22px 26px;
        display:flex;align-items:flex-start;justify-content:space-between;gap:24px;
        background:linear-gradient(to bottom, rgba(3,6,10,.86), transparent);}
  .judul{font-family:var(--mono);font-weight:700;font-size:16px;letter-spacing:.2em;
         color:var(--glow);text-shadow:0 0 16px rgba(91,232,212,.5);}
  .sub{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--faint);
       text-transform:uppercase;margin-top:5px;}

  .angka{display:flex;gap:26px;font-family:var(--mono);font-size:10.5px;color:var(--faint);
         text-align:right;}
  .angka .nilai{display:block;color:var(--ink);font-size:15px;font-weight:600;
                font-variant-numeric:tabular-nums;margin-bottom:2px;}
  .angka .label{letter-spacing:.14em;text-transform:uppercase;font-size:8.5px;}

  /* ---------- panel status layar ---------- */
  .bawah{position:absolute;bottom:0;left:0;right:0;padding:20px 26px;
         display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
         background:linear-gradient(to top, rgba(3,6,10,.86), transparent);}

  .jaga{display:flex;align-items:center;gap:11px;font-family:var(--mono);font-size:11px;
        border:1px solid var(--glow-dim);border-radius:999px;padding:9px 16px;
        background:rgba(6,14,18,.75);cursor:pointer;transition:border-color .2s,background .2s;}
  .jaga:hover{border-color:var(--glow);background:rgba(10,24,28,.9);}
  .jaga:focus-visible{outline:2px solid var(--glow);outline-offset:3px;}
  .lampu{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none;}
  .jaga.nyala .lampu{background:var(--glow);box-shadow:0 0 10px var(--glow);
                     animation:denyut 2.6s ease-in-out infinite;}
  .jaga.gagal .lampu{background:var(--danger);box-shadow:0 0 10px var(--danger);}
  @keyframes denyut{0%,100%{opacity:1;}50%{opacity:.35;}}
  .jaga .teks{color:var(--ink);}
  .jaga .durasi{color:var(--faint);font-variant-numeric:tabular-nums;}

  .tombol{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
          background:rgba(6,14,18,.75);border:1px solid var(--glow-dim);color:var(--faint);
          padding:9px 15px;border-radius:999px;cursor:pointer;transition:border-color .2s,color .2s;}
  .tombol:hover{border-color:var(--glow);color:var(--glow);}
  .tombol:focus-visible{outline:2px solid var(--glow);outline-offset:3px;}
  .kanan-bawah{display:flex;gap:9px;align-items:center;}

  /* ---------- kartu sorotan ---------- */
  .sorot{position:absolute;left:50%;bottom:16%;transform:translateX(-50%) translateY(14px);
         text-align:center;opacity:0;transition:opacity .9s ease, transform .9s ease;
         max-width:min(620px, 82vw);pointer-events:none;z-index:4;}
  .sorot.tampil{opacity:1;transform:translateX(-50%) translateY(0);}
  .sorot .kicker{font-family:var(--mono);font-size:9.5px;letter-spacing:.3em;
                 color:var(--signal);text-transform:uppercase;margin-bottom:10px;}
  .sorot .nama{font-family:var(--mono);font-size:clamp(19px,2.6vw,30px);font-weight:600;
               color:#fff;text-shadow:0 0 26px rgba(91,232,212,.45);word-break:break-word;line-height:1.3;}
  .sorot .asal{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-top:9px;
               letter-spacing:.04em;word-break:break-all;}

  .memuat{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
          flex-direction:column;gap:16px;z-index:9;background:var(--void);
          transition:opacity .8s ease;}
  .memuat.selesai{opacity:0;pointer-events:none;}
  .memuat .t{font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--glow);
             text-transform:uppercase;}
  .memuat .bar{width:190px;height:2px;background:rgba(91,232,212,.16);overflow:hidden;border-radius:2px;}
  .memuat .bar i{display:block;height:100%;width:0;background:var(--glow);
                 box-shadow:0 0 10px var(--glow);}

  @media (max-width:720px){
    .angka{gap:16px;} .sub{display:none;} .bawah{flex-direction:column;align-items:stretch;}
  }
</style>

<div class="lapis vignette"></div>

<div class="hud" id="hud">
  <div class="atas">
    <div>
      <div class="judul">ORBIT KODE</div>

</div>

</div>

    var grad = g.createRadialGradient(s/2,s/2,0, s/2,s/2,s/2);
    // Inti sengaja dibikin kecil dan rapat, halonya yang melebar. Versi
    // pertama intinya 28% dari stempel: hasilnya tiap simpul jadi gumpalan
    // kabur dan susunan jaringannya hilang. Sekarang titiknya tegas, cahaya
    // jatuh cepat, baru menipis panjang ke luar.
    grad.addColorStop(0,    '#ffffff');
    grad.addColorStop(0.085, warna);
    grad.addColorStop(0.30, warna.length === 7
      ? 'rgba(' + parseInt(warna.substr(1,2),16) + ',' + parseInt(warna.substr(3,2),16)
        + ',' + parseInt(warna.substr(5,2),16) + ',0.34)'
      : warna);
    grad.addColorStop(1,    'rgba(0,0,0,0)');
    g.fillStyle = grad;
    g.beginPath(); g.arc(s/2,s/2,s/2,0,Math.PI*2); g.fill();
    return cv;
  }
  function ambilStempel(w){
    if (!stempel[w]) stempel[w] = buatStempel(w);
    return stempel[w];
  }

  // ---------------------------------------------------------------- posisi awal (bola)
  var X = new Float32Array(N), Y = new Float32Array(N), Z = new Float32Array(N);
  var VX = new Float32Array(N), VY = new Float32Array(N), VZ = new Float32Array(N);
  var R  = new Float32Array(N);
  var FASE = new Float32Array(N);
  var WARNA = new Array(N);
  var besar = new Uint8Array(N);

  (function(){ for (var i=0;i<(META.god||[]).length;i++) besar[META.god[i]] = 1; })();

  var acak = (function(s){ return function(){ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; }; })(20261019);

  // Pusat tiap kelompok disebar di permukaan bola pakai spiral Fibonacci, bukan
  // lingkaran datar: begitu bolanya diputar, kelompok yang tadinya di belakang
  // benar-benar datang ke depan. Kalau anchornya sebidang, perputaran cuma
  // terlihat seperti gambar yang digeser.
  var NK = KLASTER.length, EMAS = Math.PI*(3-Math.sqrt(5));
  var RAD_BOLA = 300 + Math.sqrt(N)*11;
  for (var k=0;k<NK;k++){
    var t = (NK===1) ? 0 : k/(NK-1);
    var yk = 1 - t*2, rk = Math.sqrt(Math.max(0,1-yk*yk)), ak = EMAS*k;
    var besarK = Math.min(1, KLASTER[k].s / Math.max(1, KLASTER[0].s));
    var jarak = RAD_BOLA * (0.52 + 0.48*besarK);
    KLASTER[k].ax = Math.cos(ak)*rk*jarak;
    KLASTER[k].ay = yk*jarak;
    KLASTER[k].az = Math.sin(ak)*rk*jarak;
  }

  for (var i=0;i<N;i++){
    var n = NODE[i], kl = KLASTER[n.cl];
    var sebar = 12 + Math.sqrt(kl.s)*7;
    X[i] = kl.ax + (acak()*2-1)*sebar;
    Y[i] = kl.ay + (acak()*2-1)*sebar;
    Z[i] = kl.az + (acak()*2-1)*sebar;
    R[i] = 1.5 + Math.sqrt(n.d)*1.25 + (besar[i] ? 1.6 : 0);
    FASE[i] = acak()*Math.PI*2;
    WARNA[i] = n.c || WARNA_REDUP;
  }

  // ---------------------------------------------------------------- pengendapan
  var FRAME_ENDAP = 110;
  var frameEndap = 0, fase = 'endap';
  var FX = new Float32Array(N), FY = new Float32Array(N), FZ = new Float32Array(N);

  function langkahEndap(){
    FX.fill(0); FY.fill(0); FZ.fill(0);
    var i,j;
    for (i=0;i<N;i++){
      var xi=X[i], yi=Y[i], zi=Z[i];
      for (j=i+1;j<N;j++){
        var dx=xi-X[j], dy=yi-Y[j], dz=zi-Z[j];
        var d2=dx*dx+dy*dy+dz*dz+0.01;
        if (d2 > 90000) continue;
        var f=900/d2;
        FX[i]+=dx*f; FY[i]+=dy*f; FZ[i]+=dz*f;
        FX[j]-=dx*f; FY[j]-=dy*f; FZ[j]-=dz*f;
      }
    }
    for (var e=0;e<LINK.length;e++){
      var a=LINK[e][0], b=LINK[e][1];
      var ex=X[b]-X[a], ey=Y[b]-Y[a], ez=Z[b]-Z[a];
      var jar=Math.sqrt(ex*ex+ey*ey+ez*ez)+0.01;
      var rest = (NODE[a].cl===NODE[b].cl) ? 26 : 95;
      var ff=(jar-rest)*0.016/jar;
      FX[a]+=ex*ff; FY[a]+=ey*ff; FZ[a]+=ez*ff;
      FX[b]-=ex*ff; FY[b]-=ey*ff; FZ[b]-=ez*ff;
    }
    for (i=0;i<N;i++){
      var kl2 = KLASTER[NODE[i].cl];
      FX[i]+=(kl2.ax-X[i])*0.007; FY[i]+=(kl2.ay-Y[i])*0.007; FZ[i]+=(kl2.az-Z[i])*0.007;
      VX[i]=(VX[i]+FX[i])*0.8; VY[i]=(VY[i]+FY[i])*0.8; VZ[i]=(VZ[i]+FZ[i])*0.8;
      X[i]+=VX[i]; Y[i]+=VY[i]; Z[i]+=VZ[i];
    }
    frameEndap++;
    document.getElementById('memuat-bar').style.width = Math.round(frameEndap/FRAME_ENDAP*100)+'%';
    if (frameEndap >= FRAME_ENDAP){
      fase = 'orbit';
      document.getElementById('memuat').classList.add('selesai');
    }
  }

  // ---------------------------------------------------------------- kamera
  var sudut = 0;
  var LAJU = pelanGerak ? 0.00022 : 0.0011;   // satu putaran penuh ±1,5 menit
  var zoom = 1, zoomTarget = 1;
  var panX = 0, panY = 0, panTX = 0, panTY = 0;
  var FOKAL = 1100;
  var jeda = false;

  var urut = new Int32Array(N);
  for (var u=0;u<N;u++) urut[u]=u;
  var pz = new Float32Array(N), px = new Float32Array(N), py = new Float32Array(N), ps = new Float32Array(N);

  // ---------------------------------------------------------------- sorotan
  var sorotI = -1, sorotSampai = 0, sorotBerikut = 4000;
  var elSorot = document.getElementById('sorot');

  function pilihSorotan(){
    // Diambil dari simpul paling banyak tautannya - yang disorot jadi
    // benar-benar tulang punggung aplikasi, bukan simpul acak yang tak berarti.
    var kandidat = META.god && META.god.length ? META.god : [0];
    var pilih = kandidat[(Math.random()*kandidat.length)|0];
    if (pilih === sorotI && kandidat.length > 1) pilih = kandidat[(pilih+1)%kandidat.length];
    sorotI = pilih;
    var n = NODE[sorotI];
    document.getElementById('s-nama').textContent = n.l || '(tanpa nama)';
    document.getElementById('s-asal').textContent = n.f ? (n.f + '  ·  ' + n.d + ' tautan') : (n.d + ' tautan');
    elSorot.classList.add('tampil');
    zoomTarget = 1.65;
  }
  function lepasSorotan(){
    sorotI = -1;
    elSorot.classList.remove('tampil');
    zoomTarget = 1;
    panTX = 0; panTY = 0;
  }

  // ---------------------------------------------------------------- jaga layar
  var kunci = null, jagaSejak = 0, jagaAktif = false;
  var elJaga = document.getElementById('jaga');
  var elJagaTeks = document.getElementById('jaga-teks');
  var elJagaDur = document.getElementById('jaga-durasi');

  function statusJaga(kelas, teks){
    elJaga.classList.remove('nyala','gagal');
    if (kelas) elJaga.classList.add(kelas);
    elJagaTeks.textContent = teks;
  }

  async function mintaKunci(){
    if (!('wakeLock' in navigator)){
      statusJaga('gagal', 'Browser ini tidak bisa menahan layar');
      return;
    }
    try {
      kunci = await navigator.wakeLock.request('screen');
      jagaAktif = true;
      if (!jagaSejak) jagaSejak = Date.now();
      statusJaga('nyala', 'Layar ditahan tetap menyala');
      // Browser melepas kunci sendiri kalau tab disembunyikan atau layar
      // terkunci. Tanpa penanganan ini, status di layar bakal bohong:
      // tertulis aktif padahal sudah lepas sejak lama.
      kunci.addEventListener('release', function(){
        jagaAktif = false; kunci = null;
        statusJaga('', 'Tahanan layar terlepas — klik untuk nyalakan lagi');
      });
    } catch (e){
      kunci = null; jagaAktif = false;
      var sebab = (e && e.name === 'NotAllowedError')
        ? 'Ditolak browser — klik di halaman ini dulu, lalu coba lagi'
        : 'Tidak bisa menahan layar (' + ((e && e.name) || 'gagal') + ')';
      statusJaga('gagal', sebab);
    }
  }

  elJaga.addEventListener('click', function(){
    if (jagaAktif && kunci){ kunci.release(); }
    else { mintaKunci(); }
  });

  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible' && !kunci) mintaKunci();
  });

  // ---------------------------------------------------------------- kendali
  document.getElementById('btn-layar').addEventListener('click', function(){
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  });
  var btnJeda = document.getElementById('btn-jeda');
  btnJeda.addEventListener('click', function(){
    jeda = !jeda;
    btnJeda.textContent = jeda ? 'Lanjut' : 'Jeda';
  });

  // HUD meredup sendiri kalau tidak disentuh, lalu muncul lagi begitu
  // kursor/tombol disentuh - supaya saat ditinggal yang tersisa cuma grafiknya.
  var hud = document.getElementById('hud');
  var diamSejak = Date.now();
  function bangunHud(){
    diamSejak = Date.now();
    hud.classList.remove('redup');
    document.body.classList.remove('sembunyi');
  }
  ['mousemove','mousedown','keydown','touchstart','wheel'].forEach(function(ev){
    window.addEventListener(ev, bangunHud, {passive:true});
  });

  window.addEventListener('keydown', function(e){
    if (e.key === ' '){ e.preventDefault(); btnJeda.click(); }
    if (e.key === 'f' || e.key === 'F') document.getElementById('btn-layar').click();
  });

  // ---------------------------------------------------------------- angka atas
  document.getElementById('a-node').textContent = META.nNodes;
  document.getElementById('a-link').textContent = META.nLinks;
  document.getElementById('a-comm').textContent = META.nComm;
  document.getElementById('sub').textContent = 'Template Modul Ikram · ' + META.commit;
  function jam(){
    var d = new Date(), p = function(x){ return (x<10?'0':'')+x; };
    document.getElementById('a-jam').textContent = p(d.getHours())+':'+p(d.getMinutes());
    document.getElementById('a-tanggal').textContent = d.toLocaleDateString('id-ID',{day:'numeric',month:'short'});
  }
  jam(); setInterval(jam, 20000);

  function durasi(ms){
    var s = Math.floor(ms/1000), j = Math.floor(s/3600), m = Math.floor(s%3600/60);
    return j > 0 ? (j+' jam '+m+' mnt') : (m+' mnt');
  }

  // ---------------------------------------------------------------- gambar
  var t0 = performance.now(), lalu = t0;

  function gambar(now){
    requestAnimationFrame(gambar);
    ukur();
    if (!W || !H) return;

    var dt = Math.min(64, now - lalu); lalu = now;
    var t = (now - t0)/1000;

    if (fase === 'endap'){ langkahEndap(); }
    else if (!jeda){
      sudut += LAJU * (dt/16.67);
      if (now > sorotBerikut){
        if (sorotI < 0){ pilihSorotan(); sorotSampai = now + (pelanGerak ? 11000 : 8000); sorotBerikut = Infinity; }
      }
      if (sorotI >= 0 && now > sorotSampai){ lepasSorotan(); sorotBerikut = now + (pelanGerak ? 14000 : 9000); }
    }

    zoom += (zoomTarget - zoom) * 0.018;
    panX += (panTX - panX) * 0.05;
    panY += (panTY - panY) * 0.05;

    if (Date.now() - diamSejak > 9000 && !hud.classList.contains('redup')){
      hud.classList.add('redup');
      document.body.classList.add('sembunyi');
    }
    if (jagaAktif && jagaSejak) elJagaDur.textContent = '· ' + durasi(Date.now()-jagaSejak);

    ctx.fillStyle = '#03060a';
    ctx.fillRect(0,0,W,H);

    var cos = Math.cos(sudut), sin = Math.sin(sudut);
    var cx = W/2, cy = H/2;
    var ayun = pelanGerak ? 0.25 : 1;

    // proyeksi
    for (var i=0;i<N;i++){
      var ox = X[i], oy = Y[i], oz = Z[i];
      if (fase === 'orbit'){
        ox += Math.sin(t*0.4 + FASE[i])*2.4*ayun;
        oy += Math.cos(t*0.33 + FASE[i])*2.4*ayun;
      }
      var rx = ox*cos - oz*sin;
      var rz = ox*sin + oz*cos;
      // Penjepit bidang-dekat. Tanpa ini, simpul yang berputar mendekati
      // kamera membuat penyebut mendekati nol, skalanya meledak, dan satu
      // simpul saja digambar selebar ribuan piksel - satu frame bisa makan
      // satu detik penuh. Pernah terjadi: 1 fps, frame terlama 1016 ms.
      var penyebut = FOKAL + rz + RAD_BOLA*0.9;
      if (penyebut < 260) penyebut = 260;
      var skala = FOKAL / penyebut;
      pz[i] = rz;
      ps[i] = skala * zoom;
      px[i] = cx + rx*ps[i] + panX;
      py[i] = cy + oy*ps[i] + panY;
    }

    // kamera mengunci simpul yang disorot: bidikannya ikut bergerak mengikuti
    // simpul itu sementara seluruh bola tetap berputar di sekelilingnya.
    if (sorotI >= 0){
      panTX = (cx - (px[sorotI] - panX));
      panTY = (cy - (py[sorotI] - panY)) - H*0.06;
    }

    // tautan dulu, supaya simpul selalu di atasnya
    ctx.lineWidth = 1;
    for (var e=0;e<LINK.length;e++){
      var a=LINK[e][0], b=LINK[e][1];
      var kedalaman = (ps[a]+ps[b])*0.5;
      var alpha = 0.055 + kedalaman*0.075;
      if (sorotI >= 0){
        if (a === sorotI || b === sorotI) alpha = 0.55;
        else alpha *= 0.35;
      }
      if (alpha < 0.015) continue;
      ctx.strokeStyle = (sorotI>=0 && (a===sorotI||b===sorotI))
        ? 'rgba(255,180,84,'+alpha.toFixed(3)+')'
        : 'rgba(96,170,165,'+alpha.toFixed(3)+')';
      ctx.beginPath(); ctx.moveTo(px[a],py[a]); ctx.lineTo(px[b],py[b]); ctx.stroke();
    }

    // simpul diurutkan dari yang paling jauh, supaya yang depan menimpa yang belakang
    var arr = Array.prototype.slice.call(urut);
    arr.sort(function(p,q){ return pz[q]-pz[p]; });

    for (var s=0;s<N;s++){
      var idx = arr[s];
      var x = px[idx], y = py[idx];
      if (x < -60 || x > W+60 || y < -60 || y > H+60) continue;
      var jari = R[idx]*ps[idx]*1.9;
      if (jari < 0.6) continue;
      // Pagar kedua: sekecil apa pun kemungkinannya, jangan pernah biarkan
      // satu stempel digambar lebih besar dari layar.
      if (jari > 90) jari = 90;

      // makin jauh makin redup: itu yang bikin bolanya terasa punya kedalaman
      var terang = 0.3 + ps[idx]*0.95;
      if (sorotI >= 0 && idx !== sorotI) terang *= 0.42;
      if (besar[idx]) terang *= 1 + 0.22*Math.sin(t*1.2 + FASE[idx]);
      if (terang > 1) terang = 1;

      var w = (idx === sorotI) ? '#ffb454' : WARNA[idx];
      var sp = ambilStempel(w);
      var sz = jari*2.7;
      ctx.globalAlpha = Math.max(0, Math.min(1, terang));
      ctx.drawImage(sp, x-sz/2, y-sz/2, sz, sz);
    }
    ctx.globalAlpha = 1;
  }

  // Dijalankan setelah semuanya siap; kunci layar diminta sedini mungkin supaya
  // tidak perlu menunggu klik kalau browser mengizinkan.
  requestAnimationFrame(gambar);
  mintaKunci();
})();
</script>
