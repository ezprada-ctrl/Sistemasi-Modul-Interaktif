<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Video Promosi TEMPA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
/* Panggung 1920×1080 diskalakan ke jendela. Kartu kaca berisi foto asli aplikasi TEMPA & modul hasilnya (1366×768 css px) + lapisan efek. */
:root{
  --latar:#0B1220; --latar-2:#14203A; --putih:#FFFFFF; --redup:#9FB0CF;
  --aksen:#0A84FF; --aksen-terang:#7CC4FF; --oranye:#FF9F0A; --hijau:#30D158; --merah:#FF453A; --stabilo:rgba(255,214,10,.38);
  --kaca:rgba(11,18,32,.62); --tepi:rgba(255,255,255,.16);
  --huruf:"Inter","SF Pro Display",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:var(--huruf);color:var(--putih)}
body.rekam,body.rekam *{cursor:none!important}

#panggung{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--latar)}
/* latar: gradasi, aurora pelan, kisi titik (selaras latar diagram M3) */
.latar{position:absolute;inset:0;background:radial-gradient(1200px 700px at 85% 110%,var(--latar-2),transparent 70%),radial-gradient(900px 600px at 0% 0%,#101a33,transparent 70%),var(--latar)}
.aurora{position:absolute;width:900px;height:900px;border-radius:50%;filter:blur(120px);opacity:.28;mix-blend-mode:screen}
.aurora.a1{background:#1E5BFF;left:-200px;top:-300px;animation:melayang1 22s ease-in-out infinite alternate}
.aurora.a2{background:#7A3CFF;right:-300px;bottom:-400px;opacity:.2;animation:melayang2 26s ease-in-out infinite alternate}
@keyframes melayang1{to{transform:translate(260px,180px)}}
@keyframes melayang2{to{transform:translate(-220px,-160px)}}
.kisi{position:absolute;inset:-40px;background-image:radial-gradient(rgba(124,196,255,.22) 1.2px,transparent 1.3px);background-size:32px 32px;
  mask-image:radial-gradient(ellipse at center,#000 30%,transparent 78%);-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 78%);animation:geser 40s linear infinite;opacity:.55}
@keyframes geser{to{transform:translate(32px,32px)}}
#mekar{position:absolute;left:50%;top:50%;width:1400px;height:900px;margin:-450px 0 0 -700px;border-radius:50%;background:radial-gradient(closest-side,rgba(10,132,255,.35),transparent);opacity:0;filter:blur(30px)}

/* tumpukan halaman peraturan (adegan 1) */
#tumpukan{position:absolute;left:0;top:0;width:1920px;height:1080px}
.lembar{position:absolute;left:760px;top:120px;width:420px;height:560px;background:#F4F5F7;border-radius:6px;box-shadow:0 30px 60px rgba(0,0,0,.45);padding:44px 40px;color:#1d2433}
.lembar .lg{font:700 13px/1.4 var(--huruf);letter-spacing:.14em;text-align:center;color:#4a5468}
.lembar .jd{font:800 20px/1.25 var(--huruf);text-align:center;margin:10px 0 22px}
.lembar .brs{height:9px;border-radius:4px;background:#C9CED8;margin:11px 0}
.lembar .brs.p{width:72%}.lembar .brs.q{width:88%}.lembar .brs.r{width:60%}


/* adegan pembuka TEMPA: slide PowerPoint generik, ikon kode, batang durasi, lembar spreadsheet */
.ppt{position:absolute;left:720px;top:170px;width:480px;height:270px;background:#F4F5F7;border-radius:8px;box-shadow:0 30px 60px rgba(0,0,0,.45);padding:26px 30px;opacity:0}
.ppt .pj{height:26px;width:62%;border-radius:5px;background:#C0392B;opacity:.85;margin-bottom:22px}
.ppt .pb{height:11px;border-radius:5px;background:#C9CED8;margin:13px 0}
.ppt .pb.p{width:82%}.ppt .pb.q{width:66%}.ppt .pb.r{width:74%}
.kode-ikon{position:absolute;left:50%;top:300px;transform:translateX(-50%);padding:26px 44px;border-radius:26px;background:rgba(40,22,4,.85);border:3px solid var(--oranye);color:var(--oranye);font:700 110px/1 var(--mono);box-shadow:0 0 50px rgba(255,159,10,.45);opacity:0;z-index:15}
.kode-ikon i{display:inline-block;width:8px;height:96px;margin-left:12px;vertical-align:-10px;background:var(--oranye);animation:kedip 1s steps(2) infinite}
@keyframes kedip{50%{opacity:0}}
.batang{position:absolute;left:640px;top:150px;width:640px;height:560px;display:flex;align-items:flex-end;gap:120px;justify-content:center;opacity:0;z-index:15}
.batang .bt{position:relative;width:170px;border-radius:16px 16px 6px 6px;background:linear-gradient(#2a3a5e,#1a2440);border:1px solid var(--tepi)}
.batang .tinggi{height:520px;background:linear-gradient(#5a3a10,#2e1d06);border-color:rgba(255,159,10,.6)}
.batang .pendek{height:110px;background:linear-gradient(#0A84FF,#0a3f80)}
.batang span{position:absolute;left:50%;bottom:-48px;transform:translateX(-50%);white-space:nowrap;font:500 22px/1 var(--mono);color:var(--redup)}
.batang b{position:absolute;left:50%;top:-74px;transform:translateX(-50%);font-size:52px}
.sheet{position:absolute;width:520px;height:380px;border-radius:10px;background-color:#F4F5F7;box-shadow:0 30px 60px rgba(0,0,0,.45);opacity:0;
  background-image:linear-gradient(#1D6F42 0 34px,transparent 34px),repeating-linear-gradient(0deg,transparent 0 31px,#cfd5df 31px 32px),repeating-linear-gradient(90deg,transparent 0 103px,#cfd5df 103px 104px)}
.panah-alir{position:absolute;width:28px;height:4px;border-radius:2px;background:var(--aksen-terang);box-shadow:0 0 14px var(--aksen);opacity:0}
.panah-alir::after{content:"";position:absolute;right:-6px;top:-6px;border:8px solid transparent;border-left:10px solid var(--aksen-terang)}
.pil-blok{position:absolute;right:373px;top:30px;padding:10px 20px;border-radius:999px;background:var(--kaca);border:1px solid var(--tepi);backdrop-filter:blur(14px);font:600 22px/1 var(--huruf);color:var(--aksen-terang);opacity:0;z-index:22}
.lencana19{position:absolute;left:300px;top:150px;padding:14px 26px;border-radius:18px;background:var(--aksen);color:#fff;font:800 64px/1 var(--huruf);box-shadow:0 18px 40px rgba(10,132,255,.45);opacity:0;z-index:22}
.lencana19 small{font:700 24px/1 var(--huruf);margin-left:8px}
.ketik-tutup{position:absolute;background:#1b2338;border-radius:4px}
.zip{position:absolute;padding:14px 22px;border-radius:14px;background:var(--aksen);color:#fff;font:700 26px/1 var(--mono);box-shadow:0 12px 30px rgba(10,132,255,.5);opacity:0;z-index:26;white-space:nowrap}
.jam{position:absolute;left:50%;top:120px;transform:translateX(-50%);padding:12px 22px;border-radius:999px;background:rgba(20,28,46,.92);border:1px solid var(--tepi);font:600 24px/1 var(--mono);color:#FFD60A;opacity:0;z-index:24}

.baris-seret{position:absolute;overflow:hidden;border-radius:10px;border:2px solid var(--aksen);box-shadow:0 22px 40px rgba(10,132,255,.45),0 0 0 6px rgba(10,132,255,.18)}
.baris-seret img{position:absolute;left:-44px;top:-441px;width:1366px;height:768px}
/* kartu kaca */
.kartu{position:absolute;left:277px;top:41.25px;width:1366px;height:768px;border-radius:24px;opacity:0;transform:scale(.86)}
.kartu::before{content:"";position:absolute;inset:-60px;border-radius:80px;background:radial-gradient(closest-side,rgba(10,132,255,.35),transparent);filter:blur(30px);z-index:-1}
.layar{position:absolute;inset:0;border-radius:24px;overflow:hidden;border:1.5px solid var(--tepi);box-shadow:0 50px 140px rgba(0,0,0,.6),0 0 0 1px rgba(124,196,255,.08);background:#111}
.kamera{position:absolute;left:0;top:0;width:1366px;height:768px;transform-origin:0 0}
.kamera img{position:absolute;left:0;top:0;width:1366px;height:768px;display:block;user-select:none}
.lapis{position:absolute;inset:0;pointer-events:none}
.sorot{position:absolute;border:3px solid var(--aksen);border-radius:12px;box-shadow:0 0 18px rgba(10,132,255,.75),inset 0 0 12px rgba(10,132,255,.25);opacity:0}
.sorot.redupkan{box-shadow:0 0 0 4000px rgba(5,10,22,.38),0 0 18px rgba(10,132,255,.75)}
.sorot.merah{border-color:var(--merah);box-shadow:0 0 18px rgba(255,69,58,.7)}
.sorot.hijau{border-color:var(--hijau);box-shadow:0 0 22px rgba(48,209,88,.7)}
.sorot.kuning{border-color:#FFD60A;box-shadow:0 0 18px rgba(255,214,10,.7)}
.stabilo{position:absolute;background:var(--stabilo);mix-blend-mode:multiply;border-radius:3px;transform-origin:0 50%;transform:scaleX(0)}
.jejak-cahaya{fill:none;stroke:#7FE3FF;stroke-linecap:round;filter:drop-shadow(0 0 6px #33C8FF) drop-shadow(0 0 14px #0A84FF)}

/* elemen di ruang panggung */
.label{position:absolute;left:373px;top:34px;display:flex;gap:10px;align-items:center;font:500 22px/1 var(--mono);color:var(--aksen-terang);opacity:0;letter-spacing:.02em}
.label b{font:600 15px/1 var(--mono);color:var(--latar);background:var(--aksen-terang);padding:7px 10px;border-radius:8px}
.lencana{position:absolute;right:373px;top:30px;display:flex;gap:10px;align-items:center;padding:10px 18px;border-radius:999px;background:var(--kaca);border:1px solid var(--tepi);backdrop-filter:blur(14px);font:500 19px/1 var(--huruf);opacity:0}
.lencana svg{width:20px;height:20px}
#kursor{position:absolute;left:0;top:0;width:38px;height:38px;opacity:0;z-index:30;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}
.riak{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:3px solid var(--aksen-terang);opacity:0;z-index:29;box-shadow:0 0 16px rgba(10,132,255,.8)}
.balon{position:absolute;padding:12px 20px;border-radius:14px;background:rgba(10,132,255,.92);font:600 22px/1.2 var(--huruf);box-shadow:0 12px 30px rgba(10,132,255,.35);opacity:0;white-space:nowrap;z-index:25}
.balon.gelap{background:rgba(20,28,46,.92);border:1px solid var(--tepi)}
.nomor{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--aksen);display:grid;place-items:center;font:700 22px/1 var(--huruf);box-shadow:0 0 0 4px rgba(10,132,255,.25),0 0 20px rgba(10,132,255,.8);opacity:0;z-index:26}
.mengambang{position:absolute;font:700 30px/1 var(--mono);color:var(--aksen-terang);text-shadow:0 0 22px rgba(10,132,255,.9);opacity:0;letter-spacing:.06em;z-index:24}

/* teks narasi: pil kaca, muncul per kata (naik + kabur menajam) */
.teks{position:absolute;left:50%;bottom:92px;max-width:1760px;transform:translateX(-50%);padding:22px 36px;border-radius:22px;background:var(--kaca);border:1px solid var(--tepi);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);font:600 42px/1.25 var(--huruf);letter-spacing:-.01em;text-align:center;opacity:0;white-space:nowrap;z-index:20;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.teks .kt{display:inline-block;will-change:transform,filter,opacity}
.teks .tag{display:inline-block;font:600 22px/1 var(--mono);color:var(--latar);background:var(--aksen-terang);padding:9px 12px;border-radius:9px;margin-right:16px;vertical-align:6px}
.teks .coret{position:absolute;left:28px;right:28px;top:50%;height:4px;margin-top:-2px;border-radius:2px;background:var(--aksen);box-shadow:0 0 14px var(--aksen);transform:scaleX(0);transform-origin:0 50%}

/* judul */
.teks .br{display:block;height:0}
.seret{position:absolute;display:flex;align-items:center;padding:0 16px;border-radius:12px;background:#fff;border:1.5px solid #0A84FF;box-shadow:0 14px 30px rgba(10,132,255,.35);font:500 16px/1 var(--huruf);color:#1d1d1f;opacity:0;z-index:5}
.keycap{position:absolute;left:50%;top:330px;width:150px;height:150px;margin-left:-75px;border-radius:28px;background:linear-gradient(#1d2a48,#121c33);border:1.5px solid rgba(124,196,255,.45);box-shadow:0 10px 0 #0a1530,0 0 40px rgba(10,132,255,.45);display:grid;place-items:center;font:600 84px/1 var(--mono);color:#fff;opacity:0;z-index:26}
.ubin{position:absolute;top:360px;width:260px;height:220px;margin-left:0;border-radius:24px;background:var(--kaca);border:1px solid var(--tepi);backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:0 14px;font:600 22px/1.25 var(--huruf);text-align:center;opacity:0;z-index:20}
.ubin svg{width:84px;height:84px}
.garis-ubin{position:absolute;left:660px;width:600px;top:470px;height:2px;background:linear-gradient(90deg,transparent,#0A84FF,transparent);transform-origin:50% 50%;opacity:0;z-index:19}
.hal-lencana{position:absolute;left:470px;top:120px;padding:14px 26px;border-radius:18px;background:#FF9F0A;color:#1a1000;font:800 64px/1 var(--huruf);box-shadow:0 18px 40px rgba(255,159,10,.45);opacity:0;z-index:15}
.hal-lencana small{font:700 26px/1 var(--huruf)}
#judulM3{position:absolute;left:0;right:0;top:420px;text-align:center;font:800 110px/1 var(--huruf);letter-spacing:-.03em;opacity:0;z-index:22}
#judulM3 span{display:inline-block}
#hitam{position:absolute;inset:0;background:#000;z-index:40}
#pembeda{position:absolute;left:0;right:0;top:470px;text-align:center;font:800 96px/1 var(--huruf);letter-spacing:-.03em;z-index:41;opacity:0}
#pembeda .kt{display:inline-block}
#stempel{position:absolute;left:1215px;top:395px;transform:translateX(-50%) rotate(-6deg);padding:18px 34px;border:5px solid var(--hijau);border-radius:18px;color:var(--hijau);font:800 64px/1 var(--huruf);letter-spacing:-.01em;background:rgba(8,30,18,.72);backdrop-filter:blur(6px);opacity:0;z-index:23;box-shadow:0 0 40px rgba(48,209,88,.35);white-space:nowrap}
#toast{position:absolute;left:50%;top:22px;transform:translateX(-50%);display:flex;gap:14px;align-items:center;padding:16px 26px;border-radius:999px;background:rgba(28,28,30,.94);border:1px solid var(--tepi);font:500 24px/1 var(--huruf);opacity:0;z-index:23;box-shadow:0 18px 40px rgba(0,0,0,.45);white-space:nowrap}
#toast i{width:30px;height:30px;border-radius:50%;background:var(--hijau);display:grid;place-items:center;font-style:normal;font-weight:700;color:#06210f}
#tooltipTema{position:absolute;padding:10px 16px;border-radius:12px;background:rgba(28,28,30,.94);border:1px solid var(--tepi);font:500 20px/1 var(--huruf);opacity:0;z-index:23;white-space:nowrap}

/* logo: tanda air kanan-bawah dan versi besar di penutup (pil putih supaya warna logo terbaca di latar gelap) */
.logo{position:absolute;display:flex;align-items:center;gap:23px}
.logo span{display:grid;place-items:center;width:142px;height:119px;border-radius:25px;background:radial-gradient(120% 120% at 50% 0,rgba(124,196,255,.16),rgba(255,255,255,.03));border:1px solid rgba(124,196,255,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 19px 46px rgba(0,0,0,.4);backdrop-filter:blur(10px)}
.logo img{display:block;height:77px;width:auto;filter:drop-shadow(0 0 .5px rgba(255,255,255,.9))}
#logoKecil{right:40px;bottom:36px;gap:8px;opacity:0;z-index:21}
#logoKecil span{width:60px;height:50px;border-radius:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 8px 20px rgba(0,0,0,.35)}
#logoKecil img{height:32px}
#logoBesar{left:50%;top:530px;transform:translateX(-50%);opacity:0;z-index:21}
#penutup{position:absolute;left:0;right:0;top:690px;text-align:center;z-index:21}
#penutup .j{font:800 76px/1.05 var(--huruf);letter-spacing:-.025em}
#penutup .t{font:500 40px/1.2 var(--huruf);color:var(--redup);margin-top:20px}
#penutup .t .kunci{color:var(--putih)}
#penutup .d{font:500 22px/1 var(--mono);color:var(--redup);margin-top:34px;letter-spacing:.06em;opacity:0}
#penutup .kt{display:inline-block}

/* kontrol (tidak ikut terekam saat "Rekam bersih") */
#kontrol{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:16px;background:rgba(20,24,36,.88);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(12px);z-index:100;transition:opacity .3s;font:500 14px/1 var(--huruf);max-width:calc(100vw - 32px);flex-wrap:wrap}
#kontrol button{font:600 14px/1 var(--huruf);color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:10px 14px;cursor:pointer}
#kontrol button:hover{background:rgba(255,255,255,.18)}
#kontrol button:focus-visible{outline:2px solid var(--aksen-terang);outline-offset:2px}
#kontrol button.utama{background:var(--aksen);border-color:var(--aksen)}
#kontrol input[type=range]{width:300px;accent-color:var(--aksen)}
#waktu{font:500 14px/1 var(--mono);color:#cfd8ea;min-width:96px;text-align:center;font-variant-numeric:tabular-nums}
#kontrol.sembunyi{opacity:0;pointer-events:none}
#mulai[hidden]{display:none}
#mulai{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(0,0,0,.55)}
#mulai button{font:700 22px/1 var(--huruf);color:#fff;background:var(--aksen);border:0;border-radius:999px;padding:22px 40px;cursor:pointer;box-shadow:0 10px 40px rgba(10,132,255,.5)}
#mulai p{margin:18px 0 0;text-align:center;color:#cfd8ea;font:400 15px/1.5 var(--huruf)}
</style>
</head>
<body>
<div id="panggung">
  <div class="latar"></div><div class="aurora a1"></div><div class="aurora a2"></div><div class="kisi"></div><div id="mekar"></div>
  <div id="tumpukan"></div>
  <div id="kartu-wadah"></div>
  <div class="logo" id="logoKecil"><span><img src="aset/logo-1.png" alt="Logo Kementerian Keuangan"></span><span><img src="aset/logo-2.png" alt="Logo"></span><span><img src="aset/logo-3.png" alt="Logo"></span></div>
  <div class="logo" id="logoBesar"><span><img src="aset/logo-1.png" alt="Logo Kementerian Keuangan"></span><span><img src="aset/logo-2.png" alt="Logo"></span><span><img src="aset/logo-3.png" alt="Logo"></span></div>
  <div id="penutup"><div class="j" id="pJudul"></div><div class="t" id="pTag"></div><div class="d" id="pDis">Ekosistem Modul Interaktif · Data demo</div></div>
  <div id="teks-wadah"></div>
  <svg id="kursor" viewBox="0 0 24 24"><path d="M4 2.5l15.5 9.2-6.6 1.5 3.9 7.2-3.1 1.6-3.8-7.3L4.8 18.9z" fill="#fff" stroke="#0B1220" stroke-width="1.4" stroke-linejoin="round"/></svg>
  <div class="riak" id="riak"></div>
  <div id="hitam"></div>
  <div id="pembeda"></div>
</div>

<div id="mulai"><div><button id="btnMulai" type="button">▶ Putar video</button><p>Spasi: putar/jeda · R: ulang · F: layar penuh · H: sembunyikan kontrol</p></div></div>
<div id="kontrol">
  <button id="btnPutar" class="utama" type="button">Jeda</button>
  <button id="btnUlang" type="button">Ulang</button>
  <input id="geser" type="range" min="0" max="228.2" step="0.01" value="0" aria-label="Posisi video">
  <span id="waktu">0:00,0 / 3:48</span>
  <button id="btnSuara" type="button">Suara: nyala</button>
  <button id="btnPenuh" type="button">Layar penuh</button>
  <button id="btnRekam" type="button">Rekam bersih</button>
</div>

<script>
(function () {
'use strict';
const P = document.getElementById('panggung');
const $ = (id) => document.getElementById(id);
const DURASI = 228.2;

/* ---------- skala panggung ---------- */
function skala() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); P.style.transform = 'translate(' + (innerWidth - 1920 * s) / 2 + 'px,' + (innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')'; }
addEventListener('resize', skala); skala();

/* ---------- data posisi (css px pada foto 1366×768) ---------- */
const POS = {
  tema: { x: 758, y: 142, w: 38, h: 38 }, m0: { x: 314, y: 209, w: 129, h: 36 }, m1: { x: 444, y: 209, w: 125, h: 36 }, m2: { x: 571, y: 209, w: 215, h: 36 },
  m3: { x: 788, y: 209, w: 159, h: 36 }, m4: { x: 949, y: 209, w: 174, h: 36 },

/* ---------- suara (Web Audio, dibangkitkan program; selaras bunyi simulator) ---------- */
const Suara = (function () {
  let ax = null, induk = null, bisu = false, pad = null;
  function siap() {
    if (ax) return true;
    try { ax = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return false; }
    induk = ax.createGain(); induk.gain.value = .9; induk.connect(ax.destination); return true;
  }
  function nada(f, t0, dur, jenis, vol, f2) {
    const o = ax.createOscillator(), g = ax.createGain(); o.type = jenis || 'sine'; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + .008); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g); g.connect(induk); o.start(t0); o.stop(t0 + dur + .05);
  }
  function derau(t0, dur, vol, tipe, f1, f2) {
    const n = Math.floor(ax.sampleRate * dur), b = ax.createBuffer(1, n, ax.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const s = ax.createBufferSource(); s.buffer = b; const fl = ax.createBiquadFilter(); fl.type = tipe || 'bandpass'; fl.frequency.setValueAtTime(f1, t0); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t0 + dur); fl.Q.value = .9;
    const g = ax.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + dur * .3); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    s.connect(fl); fl.connect(g); g.connect(induk); s.start(t0); s.stop(t0 + dur);
  }
  const daftar = {
    whoosh: (t) => derau(t, .4, .1, 'bandpass', 300, 2400),
    sapu: (t) => derau(t, .55, .07, 'bandpass', 500, 3200),
    kertas: (t) => derau(t, .2, .12, 'highpass', 1800),
    klik: (t) => { nada(1700, t, .05, 'square', .025); derau(t, .03, .06, 'highpass', 3000); },
    pena: (t) => { derau(t, .025, .08, 'highpass', 2500); nada(2400, t + .01, .06, 'sine', .04); },
    ketuk: (t) => { nada(900, t, .06, 'sine', .07); nada(900, t + .11, .06, 'sine', .06); },
    benar: (t) => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => nada(f, t + i * .075, .35, 'sine', .07)),
    salah: (t) => { nada(440, t, .16, 'triangle', .08); nada(330, t + .15, .22, 'triangle', .08); },
    denting: (t) => { nada(1567.98, t, .7, 'sine', .05); nada(2349.3, t, .5, 'sine', .02); },
    dengung: (t) => nada(110, t, .5, 'sawtooth', .03, 90),
    denyut: (t) => nada(392, t, .9, 'sine', .03, 523.25),
    naik: (t) => { derau(t, .8, .08, 'bandpass', 200, 4000); nada(196, t, .9, 'sine', .05, 392); },
    stempel: (t) => { nada(120, t, .25, 'sine', .18, 60); derau(t, .08, .1, 'lowpass', 800); },
    kunci: (t) => { nada(1800, t, .12, 'triangle', .04); nada(2700, t + .07, .14, 'triangle', .035); derau(t + .02, .05, .04, 'highpass', 4000); },
    akor: (t) => [261.63, 329.63, 392, 523.25].forEach((f) => nada(f, t, 1.6, 'sine', .045))
  };
  for (let i = 0; i < 8; i++) daftar['tik' + i] = (t) => nada(1020, t, .07, 'sine', .05);   // penanda beruntun: bunyi sama, tidak menaik
  function mulaiPad() {
    if (pad || !ax) return;
    const g = ax.createGain(); g.gain.value = 0; const lp = ax.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.connect(g); g.connect(induk);
    const osc = [174.61, 220, 261.63, 329.63].map((f, i) => { const o = ax.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = i % 2 ? 6 : -6; o.connect(lp); o.start(); return o; });
    const lfo = ax.createOscillator(), lg = ax.createGain(); lfo.frequency.value = .08; lg.gain.value = 300; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
    g.gain.linearRampToValueAtTime(.022, ax.currentTime + 2.5);
    pad = { g: g, osc: osc.concat([lfo]) };
  }
  function hentiPad() { if (!pad) return; const p = pad; pad = null; p.g.gain.cancelScheduledValues(ax.currentTime); p.g.gain.linearRampToValueAtTime(0, ax.currentTime + .5); setTimeout(() => p.osc.forEach((o) => o.stop()), 600); }
  return {
    aktifkan: function () { if (siap()) { if (ax.state === 'suspended') ax.resume(); } },   // musik latar dihapus atas permintaan pemilik; hanya efek suara
    jeda: function () { hentiPad(); },
    bunyi: function (nama) { if (!ax || bisu || !daftar[nama] || tl.paused()) return; daftar[nama](ax.currentTime + .005); },
    setBisu: function (b) { bisu = b; if (induk) induk.gain.setTargetAtTime(b ? 0 : .9, ax.currentTime, .05); },
    bisu: () => bisu
  };
})();

/* ---------- kontrol ---------- */
const geser = $('geser'), waktu = $('waktu'), btnPutar = $('btnPutar');
const fmt = (t) => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0') + ',' + Math.floor((t % 1) * 10);
tl.eventCallback('onUpdate', () => { geser.value = tl.time(); waktu.textContent = fmt(tl.time()) + ' / 3:48'; });
tl.eventCallback('onComplete', () => { btnPutar.textContent = 'Putar'; Suara.jeda(); if (document.body.classList.contains('rekam')) setTimeout(keluarRekam, 800); });
function putar() { Suara.aktifkan(); if (tl.progress() >= 1) tl.restart(); else tl.play(); btnPutar.textContent = 'Jeda'; }
function jeda() { tl.pause(); btnPutar.textContent = 'Putar'; Suara.jeda(); }
btnPutar.onclick = () => (tl.paused() || tl.progress() >= 1 ? putar() : jeda());
$('btnUlang').onclick = () => { tl.restart(); Suara.aktifkan(); btnPutar.textContent = 'Jeda'; };
geser.oninput = () => { tl.pause(); tl.seek(+geser.value, true); btnPutar.textContent = 'Putar'; Suara.jeda(); waktu.textContent = fmt(+geser.value) + ' / 3:48'; };
$('btnSuara').onclick = () => { Suara.setBisu(!Suara.bisu()); $('btnSuara').textContent = 'Suara: ' + (Suara.bisu() ? 'mati' : 'nyala'); };
function penuh() { const d = document.documentElement; if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen().catch(() => {}); }
$('btnPenuh').onclick = () => (document.fullscreenElement ? document.exitFullscreen() : penuh());
function keluarRekam() { document.body.classList.remove('rekam'); $('kontrol').classList.remove('sembunyi'); }
$('btnRekam').onclick = () => {
  document.body.classList.add('rekam'); $('kontrol').classList.add('sembunyi'); penuh();
  tl.pause(); tl.seek(0, true); Suara.jeda();
  setTimeout(() => { Suara.aktifkan(); tl.play(0); btnPutar.textContent = 'Jeda'; }, 1600);   // 1,6 detik layar hitam: waktu untuk mulai merekam
};
$('btnMulai').onclick = () => { $('mulai').hidden = true; Suara.aktifkan(); tl.restart(); btnPutar.textContent = 'Jeda'; };
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); if (!$('mulai').hidden) $('btnMulai').click(); else btnPutar.click(); }
  else if (e.key === 'r' || e.key === 'R') $('btnUlang').click();
  else if (e.key === 'f' || e.key === 'F') $('btnPenuh').click();
  else if (e.key === 'h' || e.key === 'H') $('kontrol').classList.toggle('sembunyi');
  else if (e.key === 'Escape') keluarRekam();
});
/* tampilkan bingkai pertama yang terbaca (cuplikan tanpa diputar): detik 6,8 */
tl.seek(25.6, true);
window.__tl = tl;   // untuk alat pratinjau bingkai
})();
